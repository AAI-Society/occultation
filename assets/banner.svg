<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="occultation — what does unlinkability cost per action, and what breaks when it runs out?">
  <title>occultation</title>

  <rect width="1200" height="320" fill="#0A0A0A"/>
  <rect y="313" width="1200" height="7" fill="#CFFF04"/>

  <!-- mark -->
  <g transform="translate(96, 88) scale(0.56)">
    <circle cx="128" cy="128" r="92" fill="none" stroke="#CFFF04" stroke-width="6" opacity="0.32"/>
    <mask id="hidden">
      <circle cx="112" cy="128" r="62" fill="#fff"/>
      <circle cx="158" cy="106" r="62" fill="#000"/>
