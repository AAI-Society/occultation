    <circle cx="112" cy="128" r="62" fill="#CFFF04" mask="url(#hidden)"/>
    <circle cx="158" cy="106" r="62" fill="none" stroke="#CFFF04" stroke-width="6" opacity="0.32"/>
  </g>

  <!-- wordmark -->
  <text x="272" y="158"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="82" font-weight="700" fill="#F0EDEA" letter-spacing="-1">occultation</text>

  <text x="274" y="206"
